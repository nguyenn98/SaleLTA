<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title style="margin-left: 30%;">Quản lý bán hàng TLA</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <!-- Khung chính của ứng dụng -->
    <main class="app">
        <div id="clock"></div>
        <!-- Tiêu đề (nếu sau này không dùng có thể bỏ) -->
        <header class="app-header">
            <h2 style="margin-left: 35%;">Phiếu Báo Giá</h2>
        </header>
        <div style="margin-top: 28px">
            <span style="margin-left: 14px; font-size: 14px;">Khách hàng: </span>
            <input id="customerName" type="text" style="width: 150px; height: 22px; font-size: 14px; border: none;" />
        </div>

        <p style="margin-left: 16px; margin-top: 10px; width: 95%; font-size: 14px;"  class="address-bill">
            <span>Địa chỉ:</span>
            <textarea type="text" ;
                style="resize: none; border: none; font-size: 15px; display: flex; top: 29; margin-top: 5px; border-radius: 5px;"
                rows="4"></textarea>
        </p>

        <!-- JS sẽ render bảng vào đây -->
        <section id="product-table-container"></section>
        <p style="margin-left: 112px; font-size: 12px;">Báo giá có giá trị trong ba ngày và không có giá trị thanh toán
        </p>

    </main>

    <script type="module" src="./js/app.js"></script>
</body>

</html>
